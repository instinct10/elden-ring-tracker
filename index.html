<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор игры | Souls Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --card-bg: rgba(18, 18, 18, 0.95);
            --card-accent: #cda052;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 30%, #1a1510 0%, var(--bg) 70%),
                              url('https://www.transparenttextures.com/patterns/dark-matter.png');
            color: #e0e0e0;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        h1 {
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #cda052;
            text-shadow: 0 0 20px rgba(205, 160, 82, 0.4);
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 50px;
            text-align: center;
            font-size: 0.95rem;
        }
        .game-selector {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
            width: 100%;
        }
        .game-card {
            background: var(--card-bg);
            border: 1px solid #222;
            border-radius: 8px;
            overflow: hidden;
            width: 320px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--card-accent);
            box-shadow: 0 10px 30px color-mix(in srgb, var(--card-accent) 25%, transparent);
        }
        .game-card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #1a1a1a;
            border-bottom: 1px solid #333;
        }
        .game-card-info {
            padding: 20px;
            text-align: center;
        }
        .game-card-title {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
            color: var(--card-accent);
        }
        .game-card-desc {
            font-size: 0.85rem;
            color: #aaa;
            line-height: 1.4;
        }
        footer {
            margin-top: 60px;
            color: #444;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <h1>Souls Tracker</h1>
    <p class="subtitle">Выбери игру, чтобы посмотреть статистику смертей</p>

    <div class="game-selector" id="game-selector"></div>

    <footer>Кровь, кишки и слёзы казуалов.</footer>

    <script src="games/registry.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('game-selector');
            GAMES.forEach(game => {
                const card = document.createElement('a');
                card.href = `tracker.html?game=${game.id}`;
                card.className = 'game-card';
                card.style.setProperty('--card-accent', game.accent);
                card.innerHTML = `
                    <img src="${game.logo}" alt="${game.title}" class="game-card-image"
                         onerror="this.src='https://via.placeholder.com/320x200/1a1a1a/${game.accent.replace('#','')}?text=${encodeURIComponent(game.title)}'">
                    <div class="game-card-info">
                        <div class="game-card-title">${game.title}</div>
                        <div class="game-card-desc">${game.description}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
