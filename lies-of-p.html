<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lies of P | Boss Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Холодная палитра Lies of P */
            --steel: #7fa8c9;           /* основной акцент — стальной голубой */
            --steel-bright: #a8c8e0;    /* светлый блик */
            --deep-blue: #2e4a63;       /* тёмно-синий контур */
            --bg: #080b10;              /* почти чёрный с синевой */
            --card-bg: rgba(14, 20, 28, 0.95);
            --blood: #b02323;           /* холодный красный для победы */
            --fog: #3d5a73;             /* туманная дымка */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            /* Холодный радиальный градиент + лёгкий «морозный» оттенок */
            background-image:
                radial-gradient(circle at 50% 25%, #12202e 0%, var(--bg) 70%),
                radial-gradient(circle at 15% 80%, rgba(46, 74, 99, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 85% 60%, rgba(61, 90, 115, 0.15) 0%, transparent 45%),
                url('https://www.transparenttextures.com/patterns/dark-matter.png');
            color: #c8d4de;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, .cinzel {
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        a { text-decoration: none; color: inherit; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 20px 60px 20px;
        }

        /* Логотип игры */
        .game-logo-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }
        .game-logo {
            width: 100%;
            max-width: 350px;
            /* Холодное стальное свечение вместо золотого */
            filter: drop-shadow(0 0 20px rgba(127, 168, 201, 0.35));
        }

        /* Шапка профиля */
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 1px solid rgba(127, 168, 201, 0.18);
            padding-bottom: 30px;
        }
        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 15px;
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--steel);
            box-shadow: 0 0 25px rgba(127, 168, 201, 0.4), inset 0 0 15px rgba(0, 0, 0, 0.8);
        }
        .avatar-frame {
            position: absolute;
            top: -8px; left: -8px; right: -8px; bottom: -8px;
            border: 1px solid var(--deep-blue);
            border-radius: 50%;
            animation: rotate 15s linear infinite;
            opacity: 0.85;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .player-name {
            font-size: 2rem;
            color: var(--steel-bright);
            text-shadow: 0 0 12px rgba(127, 168, 201, 0.5);
            margin-bottom: 5px;
        }
        .stats-summary {
            font-size: 0.95rem;
            color: #9aabb8;
            letter-spacing: 1px;
            background: rgba(127, 168, 201, 0.06);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(127, 168, 201, 0.2);
            box-shadow: 0 0 15px rgba(46, 74, 99, 0.3) inset;
        }
        .stats-summary strong { color: var(--steel-bright); }

        /* Ссылка назад на главную */
        .back-link {
            display: inline-block;
            color: var(--steel);
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-bottom: 1px dotted var(--deep-blue);
            transition: color 0.3s, text-shadow 0.3s;
        }
        .back-link:hover {
            color: var(--steel-bright);
            text-shadow: 0 0 8px rgba(127, 168, 201, 0.6);
        }

        /* Панель сортировки */
        .controls-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .controls-label {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            color: #6b7d8c;
            letter-spacing: 1px;
        }
        .sort-btn {
            background: rgba(14, 20, 28, 0.7);
            border: 1px solid #2a3a4a;
            color: #8a9aa8;
            padding: 8px 16px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            border-radius: 4px;
        }
        .sort-btn:hover {
            border-color: var(--steel);
            color: #e0eaf2;
            box-shadow: 0 0 10px rgba(127, 168, 201, 0.25);
        }
        .sort-btn.active {
            border-color: var(--steel);
            color: var(--steel-bright);
            background: rgba(127, 168, 201, 0.1);
            box-shadow: 0 0 15px rgba(127, 168, 201, 0.35), inset 0 0 8px rgba(127, 168, 201, 0.1);
            font-weight: bold;
        }

        /* Сетка боссов */
        .boss-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        /* Карточка босса */
        .boss-card {
            background: var(--card-bg);
            border: 1px solid #1a2530;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .boss-card:hover {
            transform: translateY(-5px);
            border-color: var(--steel);
            box-shadow: 0 5px 25px rgba(127, 168, 201, 0.2), 0 0 0 1px rgba(127, 168, 201, 0.1);
        }

        .boss-link-wrapper {
            display: block;
            position: relative;
            height: 200px;
            overflow: hidden;
        }
        .boss-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Холодная десатурация + лёгкий синий сдвиг */
            filter: grayscale(40%) brightness(0.65) contrast(1.05);
            transition: transform 0.5s ease, filter 0.3s ease;
        }
        .boss-card:hover .boss-img {
            filter: grayscale(0%) brightness(0.95) contrast(1.05);
            transform: scale(1.05);
        }

        .boss-info {
            padding: 20px;
            border-top: 1px solid rgba(127, 168, 201, 0.25);
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .boss-title-link { transition: color 0.3s; }
        .boss-title-link:hover { color: var(--steel-bright); }
        .boss-name {
            font-size: 1.15rem;
            margin-bottom: 12px;
            color: #e6eef4;
            line-height: 1.3;
        }

        /* Статус */
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .status-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .status-defeated {
            color: var(--blood);
            border: 1px solid var(--blood);
            background: rgba(176, 35, 35, 0.08);
        }
        .status-fighting {
            color: var(--steel);
            border: 1px solid var(--steel);
            background: rgba(127, 168, 201, 0.08);
        }

        /* Список попыток */
        .attempts-list {
            margin-top: auto;
            border-top: 1px solid #1a2530;
            padding-top: 12px;
        }
        .attempt-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #7d8d9b;
        }
        .attempt-row:last-child { margin-bottom: 0; }
        .attempt-row.primary { color: #d0dae2; }
        .attempt-row.primary .player-attempts-num {
            color: var(--steel-bright);
            font-weight: bold;
            text-shadow: 0 0 8px rgba(127, 168, 201, 0.4);
        }

        /* Оверлей победы */
        .victory-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(30, 10, 10, 0.35);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 2;
        }
        .boss-card.is-defeated .victory-overlay { opacity: 1; }
        .victory-text {
            color: #d93a3a;
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: bold;
            text-shadow: 0 0 15px black, 0 0 25px rgba(176, 35, 35, 0.6);
            border-top: 2px solid #d93a3a;
            border-bottom: 2px solid #d93a3a;
            padding: 3px 15px;
            letter-spacing: 3px;
        }

        footer {
            margin-top: 80px;
            text-align: center;
            color: #3a4a58;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .player-name { font-size: 1.6rem; }
            .boss-grid { grid-template-columns: 1fr; }
            .game-logo { max-width: 260px; }
            .controls-panel { gap: 8px; }
            .sort-btn { padding: 6px 12px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ссылка на главную -->
        <div style="text-align: center; margin-bottom: 5px;">
            <a href="index.html" class="back-link">← На главную</a>
        </div>

        <!-- Логотип игры -->
        <div class="game-logo-container">
            <img src="img/Lies_of_P_logo.png" alt="Lies of P Logo" class="game-logo" onerror="this.src='https://via.placeholder.com/350x120/12202e/7fa8c9?text=Lies+of+P'">
        </div>

        <!-- Профиль -->
        <header class="profile-header">
            <div class="avatar-wrapper">
                <div class="avatar-frame"></div>
                <img src="img/avatar.jpg" alt="Player Avatar" class="avatar">
            </div>
            <h1 class="player-name">Nazar (Isshin Killer)</h1>
            <div class="stats-summary" id="stats-summary">
                Загрузка статистики...
            </div>
        </header>

        <!-- Сортировка -->
        <div class="controls-panel">
            <span class="controls-label">Сортировка:</span>
            <button class="sort-btn active" onclick="changeSort('default', this)">По порядку</button>
            <button class="sort-btn" onclick="changeSort('desc', this)">Сначала сложные (▲)</button>
            <button class="sort-btn" onclick="changeSort('asc', this)">Сначала легкие (▼)</button>
        </div>

        <!-- Сетка боссов -->
        <main class="boss-grid" id="boss-grid"></main>

        <footer>
            <p>Ложь во спасение. Правда — во тьме.</p>
        </footer>
    </div>

    <script>
        // --- БАЗА ДАННЫХ LIES OF P ---

        const bossesData = [
            {

                link: "https://liesofp.wiki.fextralife.com/Parade+Master",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 3 }
            },
            {

                img: "img/lop_mad_donkey.jpg",
                link: "https://liesofp.wiki.fextralife.com/Mad+Donkey",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 1 }
            },
            {
                name: "Бракованный смотритель (Scrapped Watchman)",
                img: "img/lop_scrapped_watchman.jpg",
                link: "https://liesofp.wiki.fextralife.com/Scrapped+Watchman",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 7 }
            },
            {

                link: "https://liesofp.wiki.fextralife.com/Puppet+of+the+Future",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 2 }
            },
            {

                img: "img/lop_survivor.jpg",
                link: "https://liesofp.wiki.fextralife.com/Survivor",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 4 }
            },
            {
                name: "Фуоко, Пламя Короля (King's Flame, Fuoco)",
                img: "img/lop_king_flame_fuoco.jpg",
                link: "https://liesofp.wiki.fextralife.com/King's+Flame,+Fuoco",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 12 }
            },
            {
                name: "Искупительница (The Atoned)",
                img: "img/lop_the_atoned.jpg",
                link: "https://liesofp.wiki.fextralife.com/The+Atoned",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 3 }
            },
            {
                name: "Падший архиепископ Андреус (Fallen Archbishop Andreus)",
                img: "img/lop_fallen_archbishop_andreus.jpg",
                link: "https://liesofp.wiki.fextralife.com/Fallen+Archbishop+Andreus",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 9 }
            },
            {
                name: "Старейшина братства чёрного кролика (Eldest of the Black Rabbit Brotherhood)",
                img: "img/lop_black_rabbit_elder.jpg",
                link: "https://liesofp.wiki.fextralife.com/Eldest+of+the+Black+Rabbit+Brotherhood",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 6 }
            },
            {
                name: "Белая леди (The White Lady)",
                img: "img/lop_white_lady.jpg",
                link: "https://liesofp.wiki.fextralife.com/The+White+Lady",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 2 }
            },
            {
                name: "Безумная марионетка-клоун (Mad Clown Puppet)",
                img: "img/lop_mad_clown_puppet.jpg",
                link: "https://liesofp.wiki.fextralife.com/Mad+Clown+Puppet",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 4 }
            },
            {
                name: "Король марионеток (King of Puppets)",
                img: "img/lop_king_of_puppets.jpg",
                link: "https://liesofp.wiki.fextralife.com/King+of+Puppets",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 21 }
            },
            {
                name: "Чемпион Виктор (Champion Victor)",
                img: "img/lop_champion_victor.jpg",
                link: "https://liesofp.wiki.fextralife.com/Champion+Victor",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 8 }
            },
            {
                name: "Доктор-сова (Owl Doctor)",
                img: "img/lop_owl_doctor.jpg",
                link: "https://liesofp.wiki.fextralife.com/Owl+Doctor",

            },
            {
                name: "Зелёный монстр болот (Green Monster of the Swamp)",
                img: "img/lop_green_monster_swamp.jpg",
                link: "https://liesofp.wiki.fextralife.com/Green+Monster+of+the+Swamp",
                defeated: true,

            {
                name: "Грабительница-ласка (Robber Weasel)",

                defeated: true,
                attempts: { [MAIN_PLAYER]: 1 }
            },
            {
                name: "Ходящий по иллюзиям (Walker of Illusions)",
                img: "img/lop_walker_of_illusions.jpg",
                link: "https://liesofp.wiki.fextralife.com/Walker+of+Illusions",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 5 }
            },
            {
                name: "Осквернённый командующий парадом (Corrupted Parade Master)",
                img: "img/lop_corrupted_parade_master.jpg",
                link: "https://liesofp.wiki.fextralife.com/Corrupted+Parade+Master",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 3 }
            },
            {
                name: "Братство чёрного кролика (Black Rabbit Brotherhood)",
                img: "img/lop_black_rabbit_brotherhood.jpg",
                link: "https://liesofp.wiki.fextralife.com/Black+Rabbit+Brotherhood",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 11 }
            },
            {
                name: "Страж дверей (Door Guardian)",
                img: "img/lop_door_guardian.jpg",
                link: "https://liesofp.wiki.fextralife.com/Door+Guardian",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 3 }
            },
            {
                name: "Чёрный кот (Black Cat)",
                img: "img/lop_black_cat.jpg",
                link: "https://liesofp.wiki.fextralife.com/Black+Cat",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 2 }
            },
            {
                name: "Лаксазия Совершенная (Laxasia the Complete)",
                img: "img/lop_laxasia.jpg",
                link: "https://liesofp.wiki.fextralife.com/Laxasia+the+Complete",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 43 }
            },
            {
                name: "Рыжая лиса (Red Fox)",
                img: "img/lop_red_fox.jpg",
                link: "https://liesofp.wiki.fextralife.com/Red+Fox",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 2 }
            },
            {
                name: "Саймон Манус, Пробудившийся бог (Simon Manus, Awakened God)",
                img: "img/lop_simon_manus.jpg",
                link: "https://liesofp.wiki.fextralife.com/Simon+Manus,+Awakened+God",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 17 }
            },
            {
                name: "Безымянная марионетка (Nameless Puppet)",
                img: "img/lop_nameless_puppet.jpg",
                link: "https://liesofp.wiki.fextralife.com/Nameless+Puppet",
                defeated: true,
                attempts: { [MAIN_PLAYER]: 26 }
            }
        ];

        let currentSortMode = 'default';

        window.addEventListener('DOMContentLoaded', () => {
            calculateStats();
            renderBosses();
        });

        function calculateStats() {
            const statsSummary = document.getElementById('stats-summary');
            let totalDefeated = 0;
            let totalAttempts = 0;

            bossesData.forEach(boss => {
                if (boss.defeated) totalDefeated++;
                if (boss.attempts[MAIN_PLAYER]) {
                    totalAttempts += boss.attempts[MAIN_PLAYER];
                }
            });

            statsSummary.innerHTML = `Побеждено боссов: <strong>${totalDefeated} / ${bossesData.length}</strong> | Всего попыток: <strong>${totalAttempts}</strong>`;
        }

        function changeSort(mode, element) {
            document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            currentSortMode = mode;
            renderBosses();
        }

        function renderBosses() {
            const bossGrid = document.getElementById('boss-grid');
            bossGrid.innerHTML = '';

            let sortedList = [...bossesData];

            if (currentSortMode === 'desc') {
                sortedList.sort((a, b) => (b.attempts[MAIN_PLAYER] || 0) - (a.attempts[MAIN_PLAYER] || 0));
            } else if (currentSortMode === 'asc') {
                sortedList.sort((a, b) => (a.attempts[MAIN_PLAYER] || 0) - (b.attempts[MAIN_PLAYER] || 0));
            }

            sortedList.forEach(boss => {
                const card = document.createElement('div');
                card.className = `boss-card ${boss.defeated ? 'is-defeated' : ''}`;

                let attemptsHTML = '';
                for (const [player, count] of Object.entries(boss.attempts)) {
                    const isPrimary = player === MAIN_PLAYER ? 'primary' : '';
                    attemptsHTML += `
                        <div class="attempt-row ${isPrimary}">
                            <span>${player}:</span>
                            <span class="player-attempts-num">${count}</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <a href="${boss.link}" target="_blank" class="boss-link-wrapper" title="Узнать больше о ${boss.name}">
                        <div class="victory-overlay">
                            <div class="victory-text">ELIMINATED</div>
                        </div>
                        <img src="${boss.img}" alt="${boss.name}" class="boss-img" onerror="this.src='https://via.placeholder.com/320x200/12202e/7fa8c9?text=${encodeURIComponent(boss.name.split('(')[0].trim())}'">
                    </a>
                    <div class="boss-info">
                        <div class="status-header">
                            <a href="${boss.link}" target="_blank" class="boss-title-link">
                                <h3 class="boss-name">${boss.name}</h3>
                            </a>
                            <span class="status-badge ${boss.defeated ? 'status-defeated' : 'status-fighting'}">
                                ${boss.defeated ? 'Побежден' : 'В бою'}
                            </span>
                        </div>
                        <div class="attempts-list">
                            ${attemptsHTML}
                        </div>
                    </div>
                `;

                bossGrid.appendChild(card);
            });
        }
    </script>
</body>
</html>
